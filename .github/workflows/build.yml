name: Build JKBrowseSafe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_VERSION: 1.2.${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create platform folders
        run: |
          flutter create --platforms=android --org com.safebrowse --project-name safe_browser .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Patch Android manifest
        run: python3 tool/patch_android.py
      - name: Patch old ProGuard setting in plugins
        run: |
          grep -rl --include=build.gradle --include=build.gradle.kts "proguard-android.txt" "$HOME/.pub-cache/hosted/pub.dev/" \
            | xargs -r sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g"
      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ env.APP_VERSION }}
          --build-number=${{ env.BUILD_NUMBER }}
          --dart-define=APP_VERSION=${{ env.APP_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: JKBrowseSafe-Android-${{ env.APP_VERSION }}
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create platform folders
        run: |
          flutter create --platforms=windows --org com.safebrowse --project-name safe_browser .
          Remove-Item -Force -ErrorAction SilentlyContinue test/widget_test.dart
      - run: flutter pub get
      - name: Patch Windows project
        shell: bash
        run: |
          sed -i '/^project(/a add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' windows/CMakeLists.txt
          sed -i 's/L"safe_browser"/L"JKBrowseSafe"/' windows/runner/main.cpp
      - name: Build Windows app
        shell: pwsh
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ env.BUILD_NUMBER }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: JKBrowseSafe-Windows-${{ env.APP_VERSION }}
          path: build/windows/x64/runner/Release/
