name: safe_browser
description: JKBrowseSafe - a privacy-focused browser for Windows and Android.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
